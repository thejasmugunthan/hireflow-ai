version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd $AWS_SRC_DIR/frontend && npm install --include=dev
    build:
      commands:
        - cd $AWS_SRC_DIR/frontend && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
